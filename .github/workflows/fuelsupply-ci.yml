name: FuelSupply CI

on:
  push:
    branches: [main, 'fuelsupply/**']
    paths: ['fuelsupply-mcp/**', '.github/workflows/fuelsupply-ci.yml']
  pull_request:
    paths: ['fuelsupply-mcp/**', '.github/workflows/fuelsupply-ci.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fuelsupply-mcp
    env:
      PYTHONPATH: ${{ github.workspace }}/fuelsupply-mcp/src
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install locked dependencies
        run: uv sync --locked --group dev --python 3.13
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Unit and API tests
        run: uv run pytest tests -q
      - name: Offline stdio MCP evaluation
        run: uv run python eval/run_protocol_eval.py
